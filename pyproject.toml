[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annstat"
version = "0.2.0"
description = "Statistical tuning, inference and compression of trained feed-forward neural networks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohamad Yamen Al-Mohamad", email = "yamenmohamad@tabrizu.ac.ir" }]
keywords = ["neural networks", "explainable AI", "statistical inference", "bootstrap", "pruning"]
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5", "scikit-learn>=1.2", "matplotlib>=3.6"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
keras = ["tensorflow>=2.12"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
